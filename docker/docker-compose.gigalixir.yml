# Docker Compose for Gigalixir Deployment
# Self-contained deployment environment
name: habbits-deploy

services:
  gigalixir:
    image: habbits-deploy:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.gigalixir
    volumes:
      - ..:/app
      - gigalixir-cache:/root/.cache
      - gigalixir-config:/root/.gigalixir
    working_dir: /app
    environment:
      - GIGALIXIR_EMAIL=${GIGALIXIR_EMAIL:-}
      - GIGALIXIR_API_KEY=${GIGALIXIR_API_KEY:-}
      - APP_NAME=${APP_NAME:-}
    stdin_open: true
    tty: true

volumes:
  gigalixir-cache:
  gigalixir-config:
