# Docker Compose for Gigalixir Deployment
# Self-contained deployment environment
version: '3.8'

services:
  gigalixir:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gigalixir
    volumes:
      - ..:/app
      - gigalixir-cache:/root/.cache
      - gigalixir-config:/root/.gigalixir
    working_dir: /app
    environment:
      - GIGALIXIR_EMAIL=${GIGALIXIR_EMAIL:-habbits.xyz@gmail.com}
      - GIGALIXIR_API_KEY=${GIGALIXIR_API_KEY:-}
      - APP_NAME=${APP_NAME:-habit-tracker-prod}
    stdin_open: true
    tty: true

volumes:
  gigalixir-cache:
  gigalixir-config:
