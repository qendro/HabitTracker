services:
  # PostgreSQL Database
  # For custom configuration, copy .env.dev to .env and docker-compose will load it
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: habit_tracker_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    environment:
      DATABASE_USER: "postgres"
      DATABASE_PASSWORD: "postgres"
      DATABASE_HOST: "db"
      DATABASE_NAME: "habit_tracker_dev"
      DATABASE_PORT: "5432"
      SECRET_KEY_BASE: "your-secret-key-base-here-change-in-production"
      PHX_HOST: "localhost"
      PHX_SERVER: "true"
      MIX_ENV: "dev"
    ports:
      - "4000:4000"
    volumes:
      - ..:/app
      - /app/deps
      - /app/_build
      - /app/assets/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "mix deps.get && mix ecto.setup && mix phx.server"
    stdin_open: true
    tty: true

  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    environment:
      DATABASE_USER: "postgres"
      DATABASE_PASSWORD: "postgres"
      DATABASE_HOST: "db"
      DATABASE_NAME: "habit_tracker_test"
      DATABASE_PORT: "5432"
      MIX_ENV: "test"
    volumes:
      - ..:/app
      - /app/deps
      - /app/_build
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "mix deps.get && mix ecto.create && mix ecto.migrate && mix test"
    profiles:
      - test

volumes:
  postgres_data:
